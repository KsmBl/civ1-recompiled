# Configuration for ./civ (read from the current directory, or --config FILE).
# Every option can also be given on the command line as --name=value.

gamedir = ../CIV          # original game files (CIV.EXE, *.PIC, ...)
res = 1920x1080           # window / screen size
fullscreen = 1            # Alt+Enter toggles
widescreen = 1            # wider map view; 0 = original 320x200 (4:3, letterboxed)
mapwidth = 160
realtime = 1              # turns pass on a clock; 0 = classic turn-based
turnsecs = 3              # realtime: seconds per turn ([ ] or - = change in game)
barbarians = 0            # 0 = no barbarians (raids, uprisings, huts)
# zoom = 5                # widescreen: screen pixels per game pixel (default height/200)
# nearest                 # sharp nearest-neighbour scaling instead of smoothed
sound = speaker           # none | speaker
mouse = 1
